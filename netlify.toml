[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://bkqdbemojbhbgemojexu.supabase.co https://graph.instagram.com https://api.anthropic.com https://*.googleapis.com; frame-src 'self' https://formbuilder.ccavenue.com https://www.google.com https://maps.google.com;"

[[redirects]]
  from = "/blogs/10-best-nursing-colleges-in-tamilnadu.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/10-best-nursing-colleges-in-tamilnadu.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
